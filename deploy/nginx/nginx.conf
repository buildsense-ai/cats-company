load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    upstream api {
        server server:6061;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP server - redirect to HTTPS (optional, uncomment in production)
    # server {
    #     listen 80;
    #     server_name localhost;
    #     return 301 https://$host:8443$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
        }

        # Dedicated streaming STT WebSocket. Keep this separate from the JSON API.
        location /api/stt/realtime {
            access_log off;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        # API
        location ^~ /api/cloud-workers {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        # OpenAI-compatible APIs can take several minutes before returning.
        location /v1/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 580s;
            proxy_send_timeout 580s;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        # Uploaded files (images, documents)
        location /uploads/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        location = /local {
            return 404;
        }

        location ^~ /local/ {
            return 404;
        }

        location /v0/channels {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_hide_header Cache-Control;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store" always;
        }

        location /static/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            expires off;
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
        }

        location = /asset-manifest.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /share {
            try_files $uri @conversation_share_shell;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location ^~ /share/ {
            try_files $uri $uri/ @conversation_share_shell;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location @conversation_share_shell {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }

    # TLS terminates at the host nginx. This container serves HTTP only.
}
