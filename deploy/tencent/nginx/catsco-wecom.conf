server {
    listen 80;
    listen [::]:80;
    server_name wecom.catsco.cn;
    return 301 https://wecom.catsco.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wecom.catsco.cn;

    ssl_certificate /etc/letsencrypt/live/wecom.catsco.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecom.catsco.cn/privkey.pem;

    client_max_body_size 2M;

    location = /health {
        proxy_pass http://10.254.0.2:12345/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /wecom/callback {
        proxy_pass http://10.254.0.2:12345/wecom/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/agent/ {
        proxy_pass http://10.254.0.2:12345;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
