# Public website entry points.
#
# www.catsco.cn (primary) and www.catsco.cc (alternate) proxy the public
# website container on 127.0.0.1:28081. Root domains redirect to their www
# host so the canonical entry is always the www address. The app/api/relay
# subdomains keep their own vhosts and are not touched here.

server {
    listen 80;
    listen [::]:80;
    server_name catsco.cn www.catsco.cn;

    return 301 https://www.catsco.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.catsco.cn;

    ssl_certificate /etc/letsencrypt/live/catsco.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catsco.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:28081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_cache off;
        add_header Cache-Control "no-cache" always;
    }
}

