# ===== uploads read path: temporary authenticated/legacy split =====
# Requests carrying Authorization use the app and current message permission checks.
# Anonymous requests retain the legacy ZOS capability-link path during migration.
location /uploads/ {
    if ($http_authorization != "") { return 419; }
    # Application-semantic query routes retain their historical app fallback.
    if ($arg_preview) { return 418; }
    if ($arg_download) { return 418; }
    # Fixed IPv4 private VIP: this domain also has an AAAA record, and static
    # resolution previously selected an unreachable IPv6 address during reload.
    proxy_pass http://100.86.2.1/catscompany/uploads/;
    proxy_set_header Host huanan-2-internal.zos.ctyun.cn;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Cache-Control;
    add_header Content-Disposition $uploads_disp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy $uploads_csp always;
    add_header Cache-Control "no-store" always;
    error_page 403 404 418 500 502 503 504 = @uploads_fallback;
    error_page 419 = @uploads_authenticated;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# No ZOS fallback here: authentication and application failures fail closed.
location @uploads_authenticated {
    proxy_pass http://127.0.0.1:28080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_intercept_errors off;
    proxy_hide_header Cache-Control;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

location @uploads_fallback {
    # Keep both logs: ops-monitor derives the ZOS fallback count from the second.
    access_log /var/log/nginx/access.log catsco_safe;
    access_log /var/log/nginx/uploads-fallback.log catsco_safe;
    proxy_pass http://127.0.0.1:28080$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
