# ===== uploads 读路径 ZOS 灰度（2026-09-21）：Content-Disposition 现状规则复刻 =====
# 空值 = 不发送 CD 头（浏览器内联）；"attachment" = 下载。
# 规则源自切换前实测：images/feedback/tutorial 全目录 + files/ 的 pdf/html/媒体 → 无 CD；其余 → attachment。
map $uri $uploads_disp {
    default                                                     "attachment";
    ~*^/uploads/(images|feedback|tutorial)/                     "";
    ~*^/uploads/files/.*\.(pdf|html?|mp4|mp3|webm|gif|webp)$    "";
}
# HTML 在 ZOS 直出路径补与应用一致的 CSP sandbox（防以媒体域源执行脚本）；空值不发送该头。
map $uri $uploads_csp {
    default                         "";
    ~*^/uploads/.*\.html?$         "sandbox allow-scripts allow-forms allow-popups allow-modals";
}
