server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public media is uploaded to the host once and mounted read-only into
    # this container. Keep it outside the image so GitHub Actions never has
    # to transfer the large videos and team photos to the domestic server.
    # Only root-level media names are matched; generated /assets/* files keep
    # using the image root above.
    location ~* ^/[^/]+\.(?:png|jpe?g|webp|mp4|pdf|svg|ico)$ {
        root /opt/catsco-website-public;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
