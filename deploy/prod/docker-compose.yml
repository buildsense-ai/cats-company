services:
  server:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-server:${IMAGE_TAG}"
    restart: unless-stopped
    environment:
      OC_DB_DRIVER: "${OC_DB_DRIVER:-mysql}"
      OC_DB_DSN: "${OC_DB_DSN:?OC_DB_DSN is required}"
      OC_DB_MAX_OPEN_CONNS: "${OC_DB_MAX_OPEN_CONNS:-}"
      OC_DB_MAX_IDLE_CONNS: "${OC_DB_MAX_IDLE_CONNS:-}"
      OC_DB_CONN_MAX_LIFETIME: "${OC_DB_CONN_MAX_LIFETIME:-}"
      OC_DB_CONN_MAX_IDLE_TIME: "${OC_DB_CONN_MAX_IDLE_TIME:-}"
      OC_RUNTIME_STORE: "${OC_RUNTIME_STORE:-}"
      OC_REDIS_URL: "${OC_REDIS_URL:-}"
      OC_REDIS_KEY_PREFIX: "${OC_REDIS_KEY_PREFIX:-}"
      CATSCO_NODE_ID: "${CATSCO_NODE_ID:-}"
      OC_JWT_SECRET: "${OC_JWT_SECRET}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      CATSCO_PUSH_RELAY_URL: "${CATSCO_PUSH_RELAY_URL:-}"
      CATSCO_PUSH_RELAY_TOKEN: "${CATSCO_PUSH_RELAY_TOKEN:-}"
      CATSCO_DEVICE_CONNECTOR_VERSION: "${CATSCO_DEVICE_CONNECTOR_VERSION:-}"
      CATSCO_DEVICE_CONNECTOR_RELEASE_BASE_URL: "${CATSCO_DEVICE_CONNECTOR_RELEASE_BASE_URL:-}"
      ADVANCED_READER_INTERNAL_URL: "${ADVANCED_READER_INTERNAL_URL:-}"
      ADVANCED_READER_CLIENT_ID: "${ADVANCED_READER_CLIENT_ID:-}"
      ADVANCED_READER_CLIENT_SECRET: "${ADVANCED_READER_CLIENT_SECRET:-}"
      ADVANCED_READER_CLIENT_SECRET_FILE: "${ADVANCED_READER_CLIENT_SECRET_FILE:-}"
      ADVANCED_READER_SIGNING_PATH: "${ADVANCED_READER_SIGNING_PATH:-/analyze}"
      ADVANCED_READER_INTERNAL_TIMEOUT_SECONDS: "${ADVANCED_READER_INTERNAL_TIMEOUT_SECONDS:-300}"
      ADVANCED_READER_PROXY_MAX_BODY_BYTES: "${ADVANCED_READER_PROXY_MAX_BODY_BYTES:-104857600}"
      CATSCO_SKILLHUB_BASE_URL: "${CATSCO_SKILLHUB_BASE_URL:-https://skillhub.catsco.fun:19990}"
      CATSCO_SKILLHUB_TIMEOUT_SECONDS: "${CATSCO_SKILLHUB_TIMEOUT_SECONDS:-15}"
      CATSCO_IMAGE_UPSTREAMS_FILE: "${CATSCO_IMAGE_UPSTREAMS_FILE:-}"
      CATSCO_IMAGE_UPSTREAM_URL: "${CATSCO_IMAGE_UPSTREAM_URL:-}"
      CATSCO_IMAGE_UPSTREAM_API_KEY: "${CATSCO_IMAGE_UPSTREAM_API_KEY:-}"
      CATSCO_IMAGE_UPSTREAM_API_KEY_FILE: "${CATSCO_IMAGE_UPSTREAM_API_KEY_FILE:-}"
      CATSCO_IMAGE_MODEL: "${CATSCO_IMAGE_MODEL:-gpt-image-2}"
      CATSCO_IMAGE_TIMEOUT_SECONDS: "${CATSCO_IMAGE_TIMEOUT_SECONDS:-540}"
      CATSCO_IMAGE_RACE_DEADLINE_SECONDS: "${CATSCO_IMAGE_RACE_DEADLINE_SECONDS:-270}"
      CATSCO_IMAGE_RACE_BACKOFF_MS: "${CATSCO_IMAGE_RACE_BACKOFF_MS:-750}"
      CATSCO_IMAGE_RACE_MAX_ATTEMPTS_PER_PROVIDER: "${CATSCO_IMAGE_RACE_MAX_ATTEMPTS_PER_PROVIDER:-2}"
      CATSCO_IMAGE_MAX_REQUEST_BYTES: "${CATSCO_IMAGE_MAX_REQUEST_BYTES:-1048576}"
      CATSCO_IMAGE_EDIT_MAX_REQUEST_BYTES: "${CATSCO_IMAGE_EDIT_MAX_REQUEST_BYTES:-25165824}"
      CATSCO_IMAGE_MAX_RESPONSE_BYTES: "${CATSCO_IMAGE_MAX_RESPONSE_BYTES:-41943040}"
      CATSCO_DREAMINA_WORKER_URL: "${CATSCO_DREAMINA_WORKER_URL:-http://dreamina-worker:7070}"
      CATSCO_DREAMINA_WORKER_TIMEOUT_SECONDS: "${CATSCO_DREAMINA_WORKER_TIMEOUT_SECONDS:-150}"
      TENCENTCLOUD_SECRET_ID: "${TENCENTCLOUD_SECRET_ID:-}"
      TENCENTCLOUD_SECRET_KEY: "${TENCENTCLOUD_SECRET_KEY:-}"
      TENCENTCLOUD_REGION: "${TENCENTCLOUD_REGION:-ap-guangzhou}"
      TENCENT_SES_FROM_EMAIL: "${TENCENT_SES_FROM_EMAIL:-}"
      TENCENT_SES_FROM_NAME: "${TENCENT_SES_FROM_NAME:-Cats Company}"
      TENCENT_SES_TEMPLATE_ID: "${TENCENT_SES_TEMPLATE_ID:-}"
      TENCENT_SES_SUBJECT: "${TENCENT_SES_SUBJECT:-Cats Company 注册验证码}"
      TENCENT_SES_REPLY_TO: "${TENCENT_SES_REPLY_TO:-}"
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL:-}"
      FEISHU_KEYWORD: "${FEISHU_KEYWORD:-cats-company}"
      FEEDBACK_FEISHU_WEBHOOK_URL: "${FEEDBACK_FEISHU_WEBHOOK_URL:-}"
      FEEDBACK_FEISHU_KEYWORD: "${FEEDBACK_FEISHU_KEYWORD:-}"
      FEEDBACK_PUBLIC_BASE_URL: "${FEEDBACK_PUBLIC_BASE_URL:-https://app.catsco.cc}"
      CATSCO_PUBLIC_BASE_URL: "${CATSCO_PUBLIC_BASE_URL:-https://app.catsco.cc}"
      CATSCO_PUBLIC_WS_URL: "${CATSCO_PUBLIC_WS_URL:-wss://app.catsco.cc/v0/channels}"
      CATSCO_FEISHU_APP_ID: "${CATSCO_FEISHU_APP_ID:-}"
      CATSCO_FEISHU_APP_SECRET: "${CATSCO_FEISHU_APP_SECRET:-}"
      CATSCO_FEISHU_ENTRY_URL_TEMPLATE: "${CATSCO_FEISHU_ENTRY_URL_TEMPLATE:-}"
      CATSCO_FEISHU_OAUTH_REDIRECT_URI: "${CATSCO_FEISHU_OAUTH_REDIRECT_URI:-}"
      CATSCO_FEISHU_EVENT_VERIFICATION_TOKEN: "${CATSCO_FEISHU_EVENT_VERIFICATION_TOKEN:-}"
      CATSCO_FEISHU_OAUTH_STATE_SECRET: "${CATSCO_FEISHU_OAUTH_STATE_SECRET:-}"
      CATSCO_FEISHU_GROUP_BOT_OPEN_IDS: "${CATSCO_FEISHU_GROUP_BOT_OPEN_IDS:-}"
      CATSCO_FEISHU_GROUP_BOT_ALIASES: "${CATSCO_FEISHU_GROUP_BOT_ALIASES:-}"
      CATSCO_CHANNEL_BINDING_TOKEN: "${CATSCO_CHANNEL_BINDING_TOKEN:-}"
      CATSCO_WEIXIN_APP_ID: "${CATSCO_WEIXIN_APP_ID:-}"
      CATSCO_WEIXIN_APP_SECRET: "${CATSCO_WEIXIN_APP_SECRET:-}"
      CATSCO_WEIXIN_EVENT_TOKEN: "${CATSCO_WEIXIN_EVENT_TOKEN:-}"
      CATSCO_WEIXIN_API_BASE_URL: "${CATSCO_WEIXIN_API_BASE_URL:-}"
      CATSCO_WEIXIN_QR_SHOW_BASE_URL: "${CATSCO_WEIXIN_QR_SHOW_BASE_URL:-}"
      CATSCO_WEIXIN_CLAWBOT_ILINK_BASE_URL: "${CATSCO_WEIXIN_CLAWBOT_ILINK_BASE_URL:-}"
      CATSCO_WEIXIN_CLAWBOT_CDN_BASE_URL: "${CATSCO_WEIXIN_CLAWBOT_CDN_BASE_URL:-}"
      CATSCO_WEIXIN_CLAWBOT_BOT_TYPE: "${CATSCO_WEIXIN_CLAWBOT_BOT_TYPE:-}"
      CATSCO_WEIXIN_CLAWBOT_QR_TIMEOUT_SECONDS: "${CATSCO_WEIXIN_CLAWBOT_QR_TIMEOUT_SECONDS:-}"
      CATSCO_WEIXIN_CLAWBOT_WORKER_ENABLED: "${CATSCO_WEIXIN_CLAWBOT_WORKER_ENABLED:-}"
      CATSCO_WEIXIN_CLAWBOT_WORKER_REFRESH_SECONDS: "${CATSCO_WEIXIN_CLAWBOT_WORKER_REFRESH_SECONDS:-}"
      CATSCO_WEIXIN_CLAWBOT_LONGPOLL_SECONDS: "${CATSCO_WEIXIN_CLAWBOT_LONGPOLL_SECONDS:-}"
      CATSCO_WEIXIN_CLAWBOT_MEDIA_HOST_ALLOWLIST: "${CATSCO_WEIXIN_CLAWBOT_MEDIA_HOST_ALLOWLIST:-}"
      CATSCO_WEIXIN_CLAWBOT_MEDIA_DOWNLOAD_URL_TEMPLATE: "${CATSCO_WEIXIN_CLAWBOT_MEDIA_DOWNLOAD_URL_TEMPLATE:-}"
      CATS_RELAY_ADMIN_URL: "${CATS_RELAY_ADMIN_URL:-}"
      CATS_RELAY_ADMIN_TOKEN: "${CATS_RELAY_ADMIN_TOKEN:-}"
      CATS_RELAY_ADMIN_TIMEOUT_SECONDS: "${CATS_RELAY_ADMIN_TIMEOUT_SECONDS:-15}"
      CATSCO_MODEL_CONFIG_ENCRYPTION_KEY: "${CATSCO_MODEL_CONFIG_ENCRYPTION_KEY:-}"
      CATSCO_BOT_MODEL_CLOUD_ENABLED: "${CATSCO_BOT_MODEL_CLOUD_ENABLED:-true}"
      CATSCO_BOT_MODEL_CLOUD_TEST_UIDS: "${CATSCO_BOT_MODEL_CLOUD_TEST_UIDS:-}"
      CATSCO_ARTIFACT_INDEX_URL: "${CATSCO_ARTIFACT_INDEX_URL:-}"
      CATSCO_ARTIFACT_MANAGEMENT_URL: "${CATSCO_ARTIFACT_MANAGEMENT_URL:-}"
      CATSCO_ARTIFACT_MANAGEMENT_TOKEN: "${CATSCO_ARTIFACT_MANAGEMENT_TOKEN:-}"
      CATSCO_ARTIFACT_NODES_JSON: "${CATSCO_ARTIFACT_NODES_JSON:-}"
      CATSCO_ARTIFACT_NODES_FILE: "${CATSCO_ARTIFACT_NODES_FILE:-}"
      CATSCO_ARTIFACT_DNS_ACCESS_KEY: "${CATSCO_ARTIFACT_DNS_ACCESS_KEY:-}"
      CATSCO_ARTIFACT_DNS_SECRET_KEY: "${CATSCO_ARTIFACT_DNS_SECRET_KEY:-}"
      CATSCO_ARTIFACT_DNS_ZONE: "${CATSCO_ARTIFACT_DNS_ZONE:-catsco.fun}"
      CATSCO_ARTIFACT_HOST_SUFFIX: "${CATSCO_ARTIFACT_HOST_SUFFIX:-artifacts.catsco.fun}"
      CATSCO_DIRECT_ARTIFACT_URL_TEMPLATE: "${CATSCO_DIRECT_ARTIFACT_URL_TEMPLATE-https://agent-{uid}.artifacts.catsco.fun:19991/artifacts}"
      CATSCO_ADMIN_UID_WHITELIST: "${CATSCO_ADMIN_UID_WHITELIST:-}"
      CATSCO_RELAY_ADMIN_URL: "${CATSCO_RELAY_ADMIN_URL:-http://host.docker.internal:18090}"
      CATS_RELAY_PUBLIC_BASE_URL: "${CATS_RELAY_PUBLIC_BASE_URL:-https://relay.catsco.cc}"
      CATS_RELAY_OPENAI_BASE_URL: "${CATS_RELAY_OPENAI_BASE_URL:-https://relay.catsco.cc/v1}"
      CATS_RELAY_ANTHROPIC_BASE_URL: "${CATS_RELAY_ANTHROPIC_BASE_URL:-https://relay.catsco.cc/anthropic}"
      CATS_RELAY_DEFAULT_MODEL: "${CATS_RELAY_DEFAULT_MODEL:-MiniMax-M2.7}"
      CATS_RELAY_DOCS_URL: "${CATS_RELAY_DOCS_URL:-https://relay.catsco.cc}"
      CATS_RELAY_SSO_SECRET: "${CATS_RELAY_SSO_SECRET:-}"
      CATS_RELAY_COMMERCIAL_ENABLED: "${CATS_RELAY_COMMERCIAL_ENABLED:-0}"
      CATS_RELAY_COMMERCIAL_TEST_UIDS: "${CATS_RELAY_COMMERCIAL_TEST_UIDS:-}"
      CATS_RELAY_COMMERCIAL_ENFORCE_ENABLED: "${CATS_RELAY_COMMERCIAL_ENFORCE_ENABLED:-0}"
      CATS_RELAY_COMMERCIAL_ENFORCE_UIDS: "${CATS_RELAY_COMMERCIAL_ENFORCE_UIDS:-}"
      # Cloud worker control plane (B4-1/B4-2): ops scripts + create quota.
      # Unset script => corresponding /api/cloud-workers action returns 503.
      CATSCO_WORKER_CREATE_QUOTA: "${CATSCO_WORKER_CREATE_QUOTA:-}"
      CATSCO_WORKER_PROVISION_SCRIPT: "${CATSCO_WORKER_PROVISION_SCRIPT:-}"
      CATSCO_WORKER_DESTROY_SCRIPT: "${CATSCO_WORKER_DESTROY_SCRIPT:-}"
      CATSCO_WORKER_RESET_SCRIPT: "${CATSCO_WORKER_RESET_SCRIPT:-}"
      CATSCO_WORKER_ROLLBACK_SCRIPT: "${CATSCO_WORKER_ROLLBACK_SCRIPT:-}"
      CATSCO_WORKER_IMAGES_SCRIPT: "${CATSCO_WORKER_IMAGES_SCRIPT:-}"
      # Cloud worker script runtime env (Tianyi Cloud credentials + networking).
      # CTYUN_AK/SK must be set in prod.env (server-side only, never commit).
      CTYUN_AK: "${CTYUN_AK:-}"
      CTYUN_SK: "${CTYUN_SK:-}"
      CTYUN_WORKER_REGION_ID: "${CTYUN_WORKER_REGION_ID:-}"
      CTYUN_WORKER_PROJECT_ID: "${CTYUN_WORKER_PROJECT_ID:-0}"
      CTYUN_WORKER_AZ_NAME: "${CTYUN_WORKER_AZ_NAME:-}"
      CTYUN_WORKER_FLAVOR_ID: "${CTYUN_WORKER_FLAVOR_ID:-}"
      CTYUN_WORKER_VPC_ID: "${CTYUN_WORKER_VPC_ID:-}"
      CTYUN_WORKER_SUBNET_ID: "${CTYUN_WORKER_SUBNET_ID:-}"
      CTYUN_WORKER_SECURITY_GROUP_ID: "${CTYUN_WORKER_SECURITY_GROUP_ID:-}"
      CTYUN_WORKER_STATE_DIR: "${CTYUN_WORKER_STATE_DIR:-/var/lib/catsco-worker}"
      CATSCO_WORKER_HTTP_BASE_URL: "${CATSCO_WORKER_HTTP_BASE_URL:-}"
      CATSCO_WORKER_SERVER_URL: "${CATSCO_WORKER_SERVER_URL:-}"
      CATS_COMMERCIAL_TEST_PAYMENT_ENABLED: "${CATS_COMMERCIAL_TEST_PAYMENT_ENABLED:-0}"
      CATS_COMMERCIAL_TEST_PAYMENT_UIDS: "${CATS_COMMERCIAL_TEST_PAYMENT_UIDS:-}"
      CATS_COMMERCIAL_TRIAL_PLAN_SLUG: "${CATS_COMMERCIAL_TRIAL_PLAN_SLUG:-}"
      CATS_ALIPAY_ENABLED: "${CATS_ALIPAY_ENABLED:-0}"
      CATS_ALIPAY_SALES_ENABLED: "${CATS_ALIPAY_SALES_ENABLED:-0}"
      CATS_ALIPAY_PRODUCTION: "${CATS_ALIPAY_PRODUCTION:-1}"
      CATS_ALIPAY_APP_ID: "${CATS_ALIPAY_APP_ID:-}"
      CATS_ALIPAY_SELLER_ID: "${CATS_ALIPAY_SELLER_ID:-}"
      CATS_ALIPAY_PRIVATE_KEY_FILE: "/run/catsco-secrets/alipay/app_private_key.pem"
      CATS_ALIPAY_PUBLIC_KEY_FILE: "/run/catsco-secrets/alipay/alipay_public_key.pem"
      CATS_ALIPAY_NOTIFY_URL: "${CATS_ALIPAY_NOTIFY_URL:-}"
      CATS_ALIPAY_RETURN_URL: "${CATS_ALIPAY_RETURN_URL:-}"
      APP_ENV: production
      TZ: Asia/Shanghai
    ports:
      - "${PROD_API_BIND_HOST:-127.0.0.1}:${PROD_API_HOST_PORT:-26061}:6061"
      - "${PROD_GRPC_BIND_HOST:-127.0.0.1}:${PROD_GRPC_HOST_PORT:-26062}:6062"
    volumes:
      - "${PROD_STACK_ROOT}/data/uploads:/app/uploads"
      - "${PROD_STACK_ROOT}/compose/tinode.prod.conf:/app/tinode.conf:ro"
      - "${PROD_STACK_ROOT}/secrets:/run/catsco-secrets:ro"
      # Cloud worker state (id_rsa/known_hosts/inject.env per tenant) must
      # survive server container recreation for destroy/reset/rollback. The
      # container-side target follows CTYUN_WORKER_STATE_DIR so an override in
      # prod.env can never silently escape the persistent volume.
      - "${PROD_STACK_ROOT}/data/catsco-worker:${CTYUN_WORKER_STATE_DIR:-/var/lib/catsco-worker}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6061/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - prodnet

  dreamina-worker:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-dreamina-worker:${DREAMINA_IMAGE_TAG:?DREAMINA_IMAGE_TAG is required}"
    restart: unless-stopped
    environment:
      DREAMINA_WORKER_HOST: "0.0.0.0"
      DREAMINA_WORKER_PORT: "7070"
      DREAMINA_WORKER_DATA_ROOT: "/var/lib/dreamina-worker"
      DREAMINA_WORKER_POLL_WAIT_SECONDS: "${DREAMINA_WORKER_POLL_WAIT_SECONDS:-12}"
      DREAMINA_CLI_BIN: "/usr/local/bin/dreamina"
      DREAMINA_CLI_TIMEOUT_MS: "${DREAMINA_CLI_TIMEOUT_MS:-120000}"
      DREAMINA_IMAGE_PROMPT_MAX_CHARS: "${DREAMINA_IMAGE_PROMPT_MAX_CHARS:-900}"
      HOME: "/home/dreamina"
      TZ: "Asia/Shanghai"
    volumes:
      - "${PROD_STACK_ROOT}/bin/dreamina:/usr/local/bin/dreamina:ro"
      - "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro"
      - "${PROD_STACK_ROOT}/data/dreamina-home:/home/dreamina"
      - "${PROD_STACK_ROOT}/data/dreamina-worker:/var/lib/dreamina-worker"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7070/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - prodnet

  web:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-web:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PROD_WEB_BIND_HOST:-127.0.0.1}:${PROD_WEB_HOST_PORT:-28080}:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && test -s /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - prodnet

networks:
  prodnet:
    name: catscompany_prod_net
