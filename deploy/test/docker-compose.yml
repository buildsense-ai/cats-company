      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - textnet

  web:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-web:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${TEST_WEB_BIND_HOST:-127.0.0.1}:${TEST_WEB_HOST_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && test -s /usr/share/nginx/html/index.html && test -s /usr/share/nginx/html/manifest.webmanifest && test -s /usr/share/nginx/html/sw.js && test -s /usr/share/nginx/html/offline.html"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - textnet

  website:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-website:${IMAGE_TAG}"
    restart: unless-stopped
    volumes:
      - "${TEST_WEBSITE_PUBLIC_ROOT:-/srv/catscompany-test/website-public}:/opt/catsco-website-public:ro"
    ports:
      - "${TEST_WEBSITE_BIND_HOST:-127.0.0.1}:${TEST_WEBSITE_HOST_PORT:-18081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - textnet

networks:
  textnet:
    name: catscompany_test_net
