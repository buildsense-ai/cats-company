services:
  mysql:
    image: mysql:8.0
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: openchat
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BOT_ASSISTANT_PASSWORD: ${BOT_ASSISTANT_PASSWORD}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "${TEST_MYSQL_BIND_HOST:-127.0.0.1}:${TEST_MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - "${TEST_STACK_ROOT}/data/mysql:/var/lib/mysql"
      - "${TEST_STACK_ROOT}/compose/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - textnet

  server:
    image: "${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER}/cats-company-server:${IMAGE_TAG}"
    restart: unless-stopped
