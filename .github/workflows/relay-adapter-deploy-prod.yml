name: Deploy Relay Adapter Prod

on:
  workflow_run:
    workflows: ["Relay Adapter CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cats-company-relay-adapter-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: relay-prod
    env:
      RELAY_ROOT: /srv/cats-bifrost
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RELAY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload versioned adapter and deploy scripts
        env:
          SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          SSH_USER: ${{ secrets.RELAY_SSH_USER }}
        run: |
          REMOTE="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ssh ${SSH_OPTS} "$REMOTE" "mkdir -p '${RELAY_ROOT}/releases' '${RELAY_ROOT}/deploy'"
          scp ${SSH_OPTS} relay/openai_adapter.py "$REMOTE:${RELAY_ROOT}/releases/openai_adapter-${REVISION}.py"
          scp ${SSH_OPTS} deploy/relay/remote-deploy.sh deploy/relay/remote-rollback.sh deploy/relay/remote-status.sh "$REMOTE:${RELAY_ROOT}/deploy/"

      - name: Deploy and verify
        env:
          SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          SSH_USER: ${{ secrets.RELAY_SSH_USER }}
        run: |
          REMOTE="${SSH_USER}@${SSH_HOST}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
          ssh ${SSH_OPTS} "$REMOTE" "chmod +x '${RELAY_ROOT}/deploy/'*.sh && '${RELAY_ROOT}/deploy/remote-deploy.sh' '${RELAY_ROOT}' '${REVISION}' && '${RELAY_ROOT}/deploy/remote-status.sh' '${RELAY_ROOT}'"

      - name: Roll back on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          SSH_USER: ${{ secrets.RELAY_SSH_USER }}
        run: |
          REMOTE="${SSH_USER}@${SSH_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=30 "$REMOTE" "test ! -x '${RELAY_ROOT}/deploy/remote-rollback.sh' || '${RELAY_ROOT}/deploy/remote-rollback.sh' '${RELAY_ROOT}'" || true
