name: Full dependency audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-company-full-dependency-audit
  cancel-in-progress: true

jobs:
  npm_audit:
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The PR gate uses Dependency Review and stays sub-minute. This separate
    # full-tree audit must tolerate a slow registry response without hanging
    # indefinitely; each npm request remains bounded below.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            directory: .
            lockfile: package-lock.json
            scope: ""
          - name: webapp
            directory: webapp
            lockfile: webapp/package-lock.json
            # Every open webapp advisory lives in the build/test toolchain
            # (picomatch, pulled in by vite, vitest and vite-plugin-pwa) and has
            # no patched release yet. Gate the shipped dependency tree here and
            # keep the dev tree visible through the reporting step below.
            scope: "--omit=dev"
          - name: TypeScript SDK
            directory: bot-sdk/typescript
            lockfile: bot-sdk/typescript/package-lock.json
            scope: ""
          - name: XiaoBa bot
            directory: bots/xiaoba-ts
            lockfile: bots/xiaoba-ts/package-lock.json
            scope: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Audit shipped JavaScript dependencies
        working-directory: ${{ matrix.directory }}
        run: >-
          npm audit ${{ matrix.scope }} --package-lock-only --audit-level=high
          --fetch-timeout=15000 --fetch-retries=1
          --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000

      # Build/test toolchain advisories stay actionable without blocking every
      # push: they ship to nobody, and picomatch currently has no patched
      # release. Drop this step (and the scope above) once a fixed picomatch
      # lands and the webapp lock can be upgraded back to a full-tree gate.
      - name: Report build toolchain advisories
        if: matrix.scope != ''
        continue-on-error: true
        working-directory: ${{ matrix.directory }}
        env:
          GHSA_URL: https://github.com/advisories/GHSA-fc5q-39xc-vjpf
        run: |
          npm audit --package-lock-only --audit-level=high \
            --fetch-timeout=15000 --fetch-retries=1 \
            --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 \
            || echo "::warning::devDependency advisories remain (see ${GHSA_URL}); they do not reach shipped assets."
