name: Deploy Docker Prod

on:
  workflow_run:
    workflows: ["Deploy Docker Test"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: cats-company-deploy-prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROD_STACK_ROOT: /srv/catscompany-prod
      DEPLOY_CACHE_ROOT: /srv/catscompany-build-cache
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      CATSCO_ARTIFACT_INDEX_URL: https://logs.catsco.fun:9000/artifacts/artifacts-index.json
      CATSCO_ARTIFACT_MANAGEMENT_URL: https://logs.catsco.fun:9000/internal/artifacts
      CATSCO_ARTIFACT_NODES_JSON: ${{ vars.CATSCO_ARTIFACT_NODES_JSON }}
      CTYUN_WORKER_PROJECT_ID: ${{ vars.CTYUN_WORKER_PROJECT_ID }}
      CTYUN_IMAGE_PROJECT_ID: ${{ vars.CTYUN_IMAGE_PROJECT_ID }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload prod stack files
        timeout-minutes: 8
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh ${SSH_OPTS} "${REMOTE}" "bash -s -- '${DEPLOY_CACHE_ROOT}'" < deploy/shared/ensure-build-cache.sh
          ssh ${SSH_OPTS} "${REMOTE}" "mkdir -p ${PROD_STACK_ROOT}/compose ${PROD_STACK_ROOT}/env ${PROD_STACK_ROOT}/bin ${PROD_STACK_ROOT}/data/uploads ${PROD_STACK_ROOT}/data/dreamina-home ${PROD_STACK_ROOT}/data/dreamina-worker ${PROD_STACK_ROOT}/data/catsco-worker ${PROD_STACK_ROOT}/logs ${PROD_STACK_ROOT}/releases ${DEPLOY_CACHE_ROOT}/releases ${DEPLOY_CACHE_ROOT}/source /usr/local/bin"

          tmpdir="$(mktemp -d)"
          mkdir -p "${tmpdir}/compose" "${tmpdir}/env"
          cp deploy/prod/bootstrap-server.sh "${tmpdir}/compose/"
          cp deploy/remote-build-source.sh "${tmpdir}/compose/"
          cp deploy/shared/cache-source-bundle.sh "${tmpdir}/compose/"
          cp deploy/prod/remote-deploy.sh "${tmpdir}/compose/"
          cp deploy/prod/remote-rollback.sh "${tmpdir}/compose/"
          cp deploy/prod/remote-status.sh "${tmpdir}/compose/"
          cp deploy/prod/ensure-image-timeout-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/ensure-cloud-worker-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/update-nginx-cloud-worker-route.py "${tmpdir}/compose/"
          cp deploy/prod/update-nginx-v1-timeout.py "${tmpdir}/compose/"
          cp deploy/prod/ensure-stt-websocket-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/ensure-public-website-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/ensure-preview-website-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/ensure-wecom-agent-nginx.sh "${tmpdir}/compose/"
          cp deploy/prod/update-nginx-stt-websocket.py "${tmpdir}/compose/"
          mkdir -p "${tmpdir}/systemd"
          cp deploy/prod/systemd/catsco-worker-release-prune.service "${tmpdir}/systemd/"
          cp deploy/prod/systemd/catsco-worker-release-prune.timer "${tmpdir}/systemd/"
          cp deploy/prod/sync-artifact-node-env.py "${tmpdir}/compose/"
          cp deploy/prod/sync-worker-project-env.py "${tmpdir}/compose/"
          cp deploy/sync-vapid-env.py "${tmpdir}/compose/"
          cp deploy/sync-stt-env.py "${tmpdir}/compose/"
          cp deploy/prod/docker-compose.yml "${tmpdir}/compose/"
          cp deploy/tencent/nginx/catscompany-app.conf "${tmpdir}/compose/"
          cp deploy/tencent/nginx/catsco-public.conf "${tmpdir}/compose/"
          cp deploy/tencent/nginx/catsco-preview.conf "${tmpdir}/compose/"
          cp deploy/tencent/nginx/catsco-wecom.conf "${tmpdir}/compose/"
          cp deploy/prod/tinode.prod.conf "${tmpdir}/compose/"
          cp deploy/prod/env.prod.example "${tmpdir}/env/"
          tar -C "${tmpdir}" -czf prod-stack-files.tar.gz .
          rm -rf "${tmpdir}"
          source_bundle="cats-company-source-${IMAGE_TAG}.tar.gz"
          remote_source="${DEPLOY_CACHE_ROOT}/releases/${source_bundle}"
          remote_temp="${remote_source}.upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh ${SSH_OPTS} "${REMOTE}" "tar -xzf - -C ${PROD_STACK_ROOT} && sudo -n install -m 0644 ${PROD_STACK_ROOT}/systemd/catsco-worker-release-prune.service /etc/systemd/system/catsco-worker-release-prune.service && sudo -n install -m 0644 ${PROD_STACK_ROOT}/systemd/catsco-worker-release-prune.timer /etc/systemd/system/catsco-worker-release-prune.timer && sudo -n systemctl daemon-reload && sudo -n systemctl enable --now catsco-worker-release-prune.timer" < prod-stack-files.tar.gz
          cache_script="${PROD_STACK_ROOT}/compose/cache-source-bundle.sh"
          if ssh ${SSH_OPTS} "${REMOTE}" "bash '${cache_script}' verify '${DEPLOY_CACHE_ROOT}' '${IMAGE_TAG}'"; then
            echo "Reusing source bundle validated by test: ${remote_source}"
          else
            echo "Shared source cache is missing; uploading the tested revision as a fallback."
            source_tree="$(mktemp -d)"
            trap 'rm -rf "${source_tree}"' EXIT
            git archive --format=tar HEAD | tar -xf - -C "${source_tree}"
            # Public website media is delivered once to the server-side
            # website-public volume; never include it in a GitHub-to-server
            # source upload, even on this cache-miss fallback path.
            rm -rf "${source_tree}/website/public"
            tar -C "${source_tree}" -czf "${source_bundle}" .
            rm -rf "${source_tree}"
            trap - EXIT
            ssh ${SSH_OPTS} "${REMOTE}" "rm -f '${remote_temp}' && timeout 420 cat > '${remote_temp}'" < "${source_bundle}"
            ssh ${SSH_OPTS} "${REMOTE}" "tar -tzf '${remote_temp}' >/dev/null && mv '${remote_temp}' '${remote_source}' && bash '${cache_script}' seal '${DEPLOY_CACHE_ROOT}' '${IMAGE_TAG}'"
          fi

      - name: Deploy prod stack
        timeout-minutes: 45
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CATSCO_ARTIFACT_MANAGEMENT_TOKEN: ${{ secrets.CATSCO_ARTIFACT_MANAGEMENT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CATSCO_PUSH_RELAY_URL: ${{ secrets.CATSCO_PUSH_RELAY_URL }}
          CATSCO_PUSH_RELAY_TOKEN: ${{ secrets.CATSCO_PUSH_RELAY_TOKEN }}
          VOLCENGINE_STT_API_KEY: ${{ secrets.VOLCENGINE_STT_API_KEY }}
          CATSCO_ARTIFACT_DNS_ACCESS_KEY: ${{ secrets.CATSCO_ARTIFACT_DNS_ACCESS_KEY }}
          CATSCO_ARTIFACT_DNS_SECRET_KEY: ${{ secrets.CATSCO_ARTIFACT_DNS_SECRET_KEY }}
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh ${SSH_OPTS} "${REMOTE}" "sudo -n bash ${PROD_STACK_ROOT}/compose/bootstrap-server.sh ${PROD_STACK_ROOT}"
          CATSCO_ARTIFACT_NODES_JSON_B64="$(printf '%s' "${CATSCO_ARTIFACT_NODES_JSON}" | base64 -w 0)"
          CATSCO_ARTIFACT_DNS_ACCESS_KEY_B64="$(printf '%s' "${CATSCO_ARTIFACT_DNS_ACCESS_KEY}" | base64 -w 0)"
          CATSCO_ARTIFACT_DNS_SECRET_KEY_B64="$(printf '%s' "${CATSCO_ARTIFACT_DNS_SECRET_KEY}" | base64 -w 0)"
          printf '%s\0%s\0%s\0%s\0%s\0' \
            "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT" "$CATSCO_PUSH_RELAY_URL" "$CATSCO_PUSH_RELAY_TOKEN" |
            ssh ${SSH_OPTS} "${REMOTE}" \
              "sudo -n python3 ${PROD_STACK_ROOT}/compose/sync-vapid-env.py ${PROD_STACK_ROOT}/env/prod.env"
          printf '%s\0' "$VOLCENGINE_STT_API_KEY" |
            ssh ${SSH_OPTS} "${REMOTE}" \
              "sudo -n python3 ${PROD_STACK_ROOT}/compose/sync-stt-env.py ${PROD_STACK_ROOT}/env/prod.env"
          printf '%s\0%s\0' "$CTYUN_WORKER_PROJECT_ID" "$CTYUN_IMAGE_PROJECT_ID" |
            ssh ${SSH_OPTS} "${REMOTE}" \
              "sudo -n python3 ${PROD_STACK_ROOT}/compose/sync-worker-project-env.py ${PROD_STACK_ROOT}/env/prod.env"
          ssh ${SSH_OPTS} "${REMOTE}" "IMAGE_TAG=${IMAGE_TAG} PROD_STACK_ROOT=${PROD_STACK_ROOT} DEPLOY_CACHE_ROOT=${DEPLOY_CACHE_ROOT} GHCR_OWNER=${{ github.repository_owner }} GHCR_USERNAME=${GHCR_USERNAME} GHCR_TOKEN=${GHCR_TOKEN} CATSCO_ARTIFACT_INDEX_URL=${CATSCO_ARTIFACT_INDEX_URL} CATSCO_ARTIFACT_MANAGEMENT_URL=${CATSCO_ARTIFACT_MANAGEMENT_URL} CATSCO_ARTIFACT_MANAGEMENT_TOKEN=${CATSCO_ARTIFACT_MANAGEMENT_TOKEN} CATSCO_ARTIFACT_NODES_JSON_B64=${CATSCO_ARTIFACT_NODES_JSON_B64} CATSCO_ARTIFACT_DNS_ACCESS_KEY_B64=${CATSCO_ARTIFACT_DNS_ACCESS_KEY_B64} CATSCO_ARTIFACT_DNS_SECRET_KEY_B64=${CATSCO_ARTIFACT_DNS_SECRET_KEY_B64} bash -s" <<'EOF'
          set -euo pipefail

          root="${PROD_STACK_ROOT}"
          revision="${IMAGE_TAG}"
          owner="${GHCR_OWNER}"
          export CATSCO_ARTIFACT_DNS_ACCESS_KEY
          export CATSCO_ARTIFACT_DNS_SECRET_KEY
          CATSCO_ARTIFACT_DNS_ACCESS_KEY="$(printf '%s' "${CATSCO_ARTIFACT_DNS_ACCESS_KEY_B64:-}" | base64 --decode)"
          CATSCO_ARTIFACT_DNS_SECRET_KEY="$(printf '%s' "${CATSCO_ARTIFACT_DNS_SECRET_KEY_B64:-}" | base64 --decode)"
          export CATSCO_ARTIFACT_NODES_JSON=
          export CATSCO_ARTIFACT_NODES_FILE=
          if [ -n "${CATSCO_ARTIFACT_NODES_JSON_B64:-}" ]; then
            mkdir -p "$root/secrets"
            artifact_nodes_temp="$root/secrets/artifact-nodes.json.new"
            printf '%s' "$CATSCO_ARTIFACT_NODES_JSON_B64" \
              | base64 --decode > "$artifact_nodes_temp"
            python3 -m json.tool "$artifact_nodes_temp" >/dev/null
            chmod 600 "$artifact_nodes_temp"
            mv "$artifact_nodes_temp" "$root/secrets/artifact-nodes.json"
            export CATSCO_ARTIFACT_NODES_FILE=/run/catsco-secrets/artifact-nodes.json
          fi
          chmod +x "$root/compose/remote-build-source.sh" "$root/compose/remote-deploy.sh" "$root/compose/remote-rollback.sh" "$root/compose/remote-status.sh" "$root/compose/ensure-image-timeout-nginx.sh" "$root/compose/ensure-cloud-worker-nginx.sh" "$root/compose/ensure-stt-websocket-nginx.sh" "$root/compose/ensure-public-website-nginx.sh" "$root/compose/ensure-preview-website-nginx.sh" "$root/compose/ensure-wecom-agent-nginx.sh"
          export CATSCO_SHARED_RELEASE_ROOT="${DEPLOY_CACHE_ROOT}/releases"
          export CATSCO_SHARED_SOURCE_ROOT="${DEPLOY_CACHE_ROOT}/source"
          sudo -n -E "$root/compose/remote-build-source.sh" "$root" "$revision" "$owner"
          export SKIP_IMAGE_PULL=1
          sudo -n -E "$root/compose/remote-deploy.sh" "$root" "$revision"
          sudo -n "$root/compose/ensure-stt-websocket-nginx.sh" /etc/nginx/sites-available/catscompany-app
          sudo -n "$root/compose/ensure-image-timeout-nginx.sh" /etc/nginx/sites-available/catscompany-app 580
          sudo -n "$root/compose/ensure-cloud-worker-nginx.sh" \
            /etc/nginx/sites-available/catscompany-app-cn:app.catsco.cn \
            /etc/nginx/sites-available/catscompany-api-cn:api.catsco.cn
          # Preview is an independent vhost and only activates after its own
          # certificate and the website health check.
          sudo -n "$root/compose/ensure-preview-website-nginx.sh" "$root"
          # Once preview is healthy, make the temporary root-domain behavior
          # explicit: catsco.cc/www redirect there, while app/relay vhosts are
          # left untouched. This helper is fail-closed and restores configs on
          # nginx validation failure.
          sudo -n "$root/compose/ensure-public-website-nginx.sh" "$root"
          sudo -n "$root/compose/ensure-wecom-agent-nginx.sh" "$root"
          sudo -n "$root/compose/remote-status.sh" "$root"
          EOF

      - name: Roll back prod stack on failure
        if: failure()
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "GHCR_USERNAME=${GHCR_USERNAME} GHCR_TOKEN=${GHCR_TOKEN} sudo -n -E bash ${PROD_STACK_ROOT}/compose/remote-rollback.sh ${PROD_STACK_ROOT} || true"

      - name: Dump prod status on failure
        if: failure()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "sudo -n bash ${PROD_STACK_ROOT}/compose/remote-status.sh ${PROD_STACK_ROOT} || true"
