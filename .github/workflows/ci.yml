name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xiaoba-client-compatibility:
    name: XiaoBa client compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CatsCompany
        uses: actions/checkout@v6
      - name: Check paired XiaoBa mainline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/check-xiaoba-client-compat.py --mode main
      - name: Test compatibility gate
        run: python3 -m unittest deploy/xiaoba-client-compatibility_test.py

  # Split into unit/race legs: the unit suite and the -race cases are
  # independent, and serially each costs about 90s of the backend job. The job
  # id stays the same, so the release gate keeps using needs.backend.result
  # (matrix results aggregate across legs).
  backend:
    name: Backend tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [unit, race]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # setup-go caches modules and the toolchain but not GOCACHE. A cold race
      # build compiles the whole dependency tree (2-3 min); GOCACHE is
      # content-addressed, so sharing one key across both legs is safe.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-backend-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-backend-

      - name: Test backend
        if: matrix.part == 'unit'
        run: go test ./server/... ./cmd/tos-fetch

      - name: Scan Go vulnerabilities
        if: matrix.part == 'unit'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test authorization-only storage concurrency
        if: matrix.part == 'race'
        run: go test -race ./server ./server/cmd -run '^TestDeviceAuthorization' -count=1

      - name: Test first-message device authorization concurrency
        if: matrix.part == 'race'
        run: go test -race ./server -run '^Test(ExplicitDeviceGrantBeforeFirstPickerRead|ConcurrentFirstDeviceMessages|FirstDeviceRevision)' -count=1

      - name: Test race-sensitive concurrency
        if: matrix.part == 'race'
        run: go test -race ./server -run 'TestImageRace|TestScriptedImageUpstream|TestArtifactResultSendClaimLinearizesWithPreviewInvalidation|TestArtifactWritebackGrantSharesSnapshotCurrentBoundary|TestArtifactContextConcurrentCreateInvalidatesEveryNonCurrentWriteback|TestSkillHubMarketplace|TestSkillHubPublication(Read|Workspace|Delivery|CaptureTransport|CaptureDispatcher|RepairSourceTransport|UploadTransport|Peer|CommitClient|CommitDispatcher|HumanCommit|CancellationTransport|CancellationDispatcher)|TestPublicationDescription(Copy|Derivation|Validation|ReleasePlan|ReleaseAuthorize)|Test(Read|Validate|Accept|Continue|Plan|Authorize|Record)ConfirmedPublicationDescription' -count=1

      - name: Test status-only reconciliation concurrency
        if: matrix.part == 'race'
        run: go test -race ./server -run '^TestSkillHubPublicationDescriptionReconcile' -count=1

      - name: Test restricted repair model coordinator concurrency
        if: matrix.part == 'race'
        run: go test -race ./server -run '^TestPublicationRepairModel' -count=1

  publication_repair_source_paired:
    name: Publication repair source paired contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CatsCo
        uses: actions/checkout@v6
        with:
          path: cats-company
      - name: Checkout pinned XiaoBa Runtime
        uses: actions/checkout@v6
        with:
          repository: buildsense-ai/XiaoBa-CLI
          # PR569: dedicated live source verification, never capture replay.
          ref: 062c7cf1b11fa49fdc44466c1cbfe80b041d11c4
          path: XiaoBa-CLI
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XiaoBa-CLI/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - name: Install pinned Runtime dependencies
        working-directory: XiaoBa-CLI
        env:
          # These Node/Go contracts never start the desktop shell.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        # The pinned lock contains npmmirror tarball URLs. Override only that
        # host; keep locked versions, integrity checks and lifecycle scripts.
        run: npm ci --prefer-offline --no-audit --fund=false --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com
      - name: Verify real Runtime source checks without skip fallback
        working-directory: cats-company
        env:
          XIAOBA_REPO: ../XiaoBa-CLI
        run: node scripts/test-publication-repair-source-paired.mjs

  publication_repair_material_paired:
    name: Publication repair private material paired contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: repair_material_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d repair_material_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout CatsCo
        uses: actions/checkout@v6
        with:
          path: cats-company
      - name: Checkout pinned Cloud material reader
        uses: actions/checkout@v6
        with:
          repository: buildsense-ai/catsco-skillhub-cloud
          # Cloud PR71: private original rejection bytes; no model execution.
          ref: f14df745048aeba14f22424a814b6590518a7523
          path: skillhub-cloud
      - name: Checkout pinned XiaoBa Runtime
        uses: actions/checkout@v6
        with:
          repository: buildsense-ai/XiaoBa-CLI
          # PR569: real source capture and live repair-source checks.
          ref: 062c7cf1b11fa49fdc44466c1cbfe80b041d11c4
          path: XiaoBa-CLI
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillhub-cloud/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - name: Prepare isolated Cloud database
        working-directory: skillhub-cloud
        env:
          SKILLHUB_DATABASE_URL: postgres://catsco:catsco_test@127.0.0.1:5432/repair_material_test?sslmode=disable
        run: |
          npm ci --ignore-scripts --no-audit --fund=false
          npm run db:migrate
      - name: Install pinned XiaoBa Runtime dependencies
        working-directory: XiaoBa-CLI
        env:
          # Keep lifecycle scripts, but avoid an unrelated desktop binary CDN.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        # Use the official tarballs when the pinned lock's mirror is unavailable.
        run: npm ci --prefer-offline --no-audit --fund=false --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com
      - name: Verify Runtime + Cloud composition and exotic encoding vectors
        working-directory: cats-company
        env:
          SKILLHUB_REPAIR_MATERIAL_ROOT: ${{ github.workspace }}/skillhub-cloud
          SKILLHUB_TEST_DATABASE_URL: postgres://catsco:catsco_test@127.0.0.1:5432/repair_material_test?sslmode=disable
          XIAOBA_REPAIR_PAIRED_ROOT: ${{ github.workspace }}/XiaoBa-CLI
          XIAOBA_REPAIR_PAIRED_NODE: node
        run: |
          test -n "$SKILLHUB_TEST_DATABASE_URL"
          node scripts/test-publication-repair-runtime-cloud-paired.mjs
      - name: Verify remaining material unit and projection contracts
        working-directory: cats-company
        run: go test -race ./server -run '^TestPublicationRepairMaterial(Client|Projection)' -count=1 -v

  # DB 契约测试独立成 job：与 backend（编译/单测/race/漏洞扫描）并行，
  # 避免 4~5 分钟的单步把整体墙钟拖到 9 分钟。
  # publication 套件（88 个用例，全部并行化）是 DB 契约里最重的一块，
  # 单独成 job 与 backend_db 并行，避免它串在所有其他契约后面拉长关键路径。
  # 142 publication cases ran serially inside one 217s step, the critical path of
  # the whole run. Split by the first two letters of each test name into three
  # disjoint halves-plus (checked by ci/shard_coverage.py), with the race
  # contracts as a fourth leg. The job id stays the same, so the release gate
  # keeps using needs.backend_publication.result.
  backend_publication:
    name: Backend publication contracts (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [entries-a, entries-b, entries-c, race]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cats_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d cats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # setup-go caches modules and the toolchain but not GOCACHE. GOCACHE is
      # content-addressed, so one key shared by all legs is safe and the first
      # leg warms the rest.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-backend-publication-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-backend-publication-

      - name: Tune PostgreSQL for throwaway CI data
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_commit = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET full_page_writes = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW fsync"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW synchronous_commit"

      # Pre-create the trigram extension: CREATE EXTENSION IF NOT EXISTS is not
      # atomic across concurrent sessions, so two parallel tests can collide on
      # pg_extension_name_index. Installing it once up front removes the race and
      # the permission-denied fallback path.
      - name: Prepare PostgreSQL message search extension
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Test PostgreSQL SkillHub publication entries (A At/Au/Ca/Cl/Id)
        if: matrix.part == 'entries-a'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestPostgresSkillHubPublication(At|Au|Ca|Cl|Id)' -count=1

      - name: Test PostgreSQL SkillHub publication entries (B Co/De)
        if: matrix.part == 'entries-b'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestPostgresSkillHubPublication(Co|De)' -count=1

      - name: Test PostgreSQL SkillHub publication entries (C In/Mi/Ow/Pe/Ra/Re/So/Up)
        if: matrix.part == 'entries-c'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestPostgresSkillHubPublication(In|Mi|Ow|Pe|Ra|Re|So|Up)' -count=1

      # Five -race contracts in one invocation: each extra `go test -race` call
      # relinks the race binary (30-60s), so merging them still covers the same
      # cases without paying the link cost five times.
      - name: Test PostgreSQL SkillHub publication race-sensitive contracts
        if: matrix.part == 'race'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_PG_TEST_DSN"
          go test -race ./server/db/postgres -count=1 -v -run '^(TestPostgresSkillHubPublication.*(Concurren|Race|Fencing|Atomic|Replay|Recovery)|TestPostgresSkillHubPublicationDescriptionReleaseOutcomeHistoricalRead|TestPostgresSkillHubPublicationRepairModel(Call|Execution)|TestPostgresSkillHubPublicationDescriptionTerminal|TestPostgresSkillHubPublicationDescriptionReconcile)$'
  # Thirteen contract steps ran serially for 312s, the slowest job in the run.
  # Split into three legs: credit (model-credit races, 123s), durability
  # (message search + conversation task durability, 76s) and store (the rest).
  # The job id stays the same, so the release gate keeps using
  # needs.backend_db.result (aggregated across legs).
  backend_db:
    name: Backend DB contracts (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [credit, durability, store]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cats_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d cats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cats_test
          MYSQL_USER: catsco
          MYSQL_PASSWORD: catsco_test
          MYSQL_ROOT_PASSWORD: catsco_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucatsco -pcatsco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # setup-go caches modules and the toolchain but not GOCACHE. GOCACHE is
      # content-addressed, so one key shared by all legs is safe and the first
      # leg warms the rest.
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-backend-db-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-backend-db-

      # These contracts run a full migration per case (heavy DDL/COMMIT). The CI
      # database is disposable, so dropping fsync/WAL durability cuts commit
      # latency without changing any assertion (crash recovery is not in scope).
      - name: Tune PostgreSQL for throwaway CI data
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_commit = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET full_page_writes = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW fsync"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW synchronous_commit"

      # Pre-create the trigram extension: CREATE EXTENSION IF NOT EXISTS is not
      # atomic across concurrent sessions, so two parallel tests can collide on
      # pg_extension_name_index. Installing it once up front removes the race and
      # the permission-denied fallback path.
      - name: Prepare PostgreSQL message search extension
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      # The conversation-task durability cases create MySQL triggers, so this leg
      # needs log_bin_trust_function_creators set before its tests run. The store
      # leg sets it later on purpose: its restricted-schema case asserts the
      # default (denied) state first.
      - name: Configure MySQL trigger prerequisite for durability cases
        if: matrix.part == 'durability'
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'

      - name: Test PostgreSQL model credit contracts and races
        if: matrix.part == 'credit'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_PG_TEST_DSN"
          go test -race ./server/db/postgres -run '^Test(PostgresModelCredit|ModelCreditEligibility|PostgresCreditSubscriptionPaymentGrantsMonthlyOnly)' -parallel=1 -count=1 -v
          go test -race ./server ./server/cmd ./server/store -run 'Test.*ModelCredit|^TestDeviceAuthorization' -count=1

      - name: Test message search and conversation task run durability
        if: matrix.part == 'durability'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: |
          go test ./server/db/postgres ./server/db/mysql -run '^Test(Postgres|MySQL)MessageSearch(VisibleText|NativeIndex|IndexMigration|GramMigration|GramContainment|WithoutExtensionPrivileges)$' -count=1 -v
          go test ./server/db/postgres ./server/db/mysql -run '^Test(PostgresConversationTaskRun|MySQLConversationTask)' -count=1 -v
          go test -race ./server -run '^TestConversationTaskStatus(Delivery|History|Postgres)' -count=1 -v

      - name: Verify restricted MySQL schema failure
        if: matrix.part == 'store'
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          CATS_SESSION_FORK_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
          CATS_SESSION_FORK_MYSQL_EXPECT_PERMISSION_DENIED: "1"
        run: |
          test "$(docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -Nse 'SELECT @@GLOBAL.log_bin, @@GLOBAL.log_bin_trust_function_creators')" = $'1\t0'
          go test ./server/db/mysql -run '^TestSessionForkMySQLRestrictedSchema$' -count=1 -v

      - name: Configure dedicated CI MySQL trigger prerequisite
        if: matrix.part == 'store'
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          # Only this disposable service is configured as administrator. All Go
          # integration tests still connect as the database-scoped catsco user.
          docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'
          test "$(docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -Nse 'SELECT @@GLOBAL.log_bin, @@GLOBAL.log_bin_trust_function_creators')" = $'1\t1'

      - name: Test MySQL session fork contract
        if: matrix.part == 'store'
        env:
          CATS_SESSION_FORK_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: |
          test -n "$CATS_SESSION_FORK_MYSQL_TEST_DSN"
          go test ./server/db/mysql -run '^TestSessionForkMySQL' -count=1 -v

      - name: Test PostgreSQL session fork contract
        if: matrix.part == 'store'
        env:
          CATS_SESSION_FORK_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_SESSION_FORK_PG_TEST_DSN"
          go test ./server/db/postgres -run '^TestSessionForkPostgres' -count=1 -v

      - name: Test PostgreSQL store contract
        if: matrix.part == 'store'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run 'TestPostgres(AdminUserSearch|StoreContract|CloudWorkerDeploymentContract|CloudWorkerRuntimeCreditsContract|CloudWorkerLifecycleTermContract|CloudWorkerPackageTermContract|CommercialActionMachineTermPreview|CommercialRefundSettlesSharedWorkerTerms|CommercialAdjustmentSettlesSharedWorkerTerms|CloudWorkerMachineTermChain|CommercialEarlyRenewalKeepsSharedWorkerTerm|CommercialExtendKeepsSharedWorkerTerm|CommercialInviteRedeemSettlesSharedWorkerTerms|CreditInviteKeepsMachineWindow|CommercialFutureGapDoesNotExtendWorkerTerm|CommercialPlanManagement|CommercialPaymentContract|CommercialAdjustmentContract|CommercialActionsContract|WorkerActionHistorySurvivesRollback|CommercialGLM53MigrationPreservesManualQuotaAndRollsBack|CommercialNativeSearchFlashMigrationPreservesManualQuotaAndRollsBack|CommercialRetireV4FlashMigrationPreservesManualQuotaAndRollsBack|CommercialFreeImageModelsMigrationGrantsAndRollsBack|CommercialAutoRenewConfigAndRuns|CommercialRecordsBeyondFirstHundred|CommercialPublicModelsPreserveRenewalAndCustomQuota|CommercialImageModels|CommercialInviteRedeemerUIDs|ArtifactRuntimeEventSequenceFollowsCommitOrder|ArtifactAppMetadataPersistence)' -count=1 -v

      - name: Test PostgreSQL credit top-up and paid machine upgrades
        if: matrix.part == 'credit'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_PG_TEST_DSN"
          go test -race ./server/db/postgres -run '^TestPostgres(CreditTopup|MachineUpgrade|MachinePlanTerm)' -parallel=1 -count=1 -v
          go test -race ./server -run '^Test(MachineUpgrade|CommercialTopup)' -count=1

      - name: Test PostgreSQL multi-device selection contract
        if: matrix.part == 'store'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestDeviceSelection' -count=1 -v

      - name: Test PostgreSQL SkillHub dispatcher recovery
        if: matrix.part == 'store'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_PG_TEST_DSN"
          go test -race ./server -run '^TestSkillHubPublication(DeliveryPostgres|CaptureTransportPostgres|CaptureDispatcher|PeerCommitPostgres|DescriptionReleaseHistoryPostgres)' -count=1 -v

      - name: Test PostgreSQL service agent store
        if: matrix.part == 'store'
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestService' -count=1 -v

      - name: Test MySQL Artifact Runtime and application metadata
        if: matrix.part == 'store'
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run 'TestMySQL(ArtifactRuntimeEventSequenceFollowsCommitOrder|AdminUserSearch|ArtifactAppMetadataPersistence)' -count=1 -v

      - name: Test MySQL service agent store
        if: matrix.part == 'store'
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run '^TestMySQLService' -count=1 -v

      - name: Test MySQL multi-device selection contract
        if: matrix.part == 'store'
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run '^TestDeviceSelection' -count=1 -v

  node_sdk:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot-sdk/typescript/package-lock.json

      - name: Restore TypeScript SDK dependencies
        id: sdk-node-modules
        uses: actions/cache@v4
        with:
          path: bot-sdk/typescript/node_modules
          key: ${{ runner.os }}-node24-sdk-${{ hashFiles('bot-sdk/typescript/package-lock.json') }}

      - name: Install TypeScript SDK dependencies
        if: steps.sdk-node-modules.outputs.cache-hit != 'true'
        working-directory: bot-sdk/typescript
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test TypeScript SDK
        working-directory: bot-sdk/typescript
        run: |
          npm run build
          npm test
          npm run test:types

  bot_example:
    name: TypeScript bot example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            bots/xiaoba-ts/package-lock.json
            bot-sdk/typescript/package-lock.json

      - name: Restore bot example dependencies
        id: bot-node-modules
        uses: actions/cache@v4
        with:
          path: bots/xiaoba-ts/node_modules
          key: ${{ runner.os }}-node24-bot-example-${{ hashFiles('bots/xiaoba-ts/package-lock.json', 'bot-sdk/typescript/package-lock.json') }}

      - name: Install bot example dependencies
        if: steps.bot-node-modules.outputs.cache-hit != 'true'
        working-directory: bots/xiaoba-ts
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build TypeScript bot example
        working-directory: bots/xiaoba-ts
        run: npm run build

  shimo_worker:
    name: Shimo browser worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/shimo-browser-worker/package-lock.json

      - name: Install dependencies
        working-directory: services/shimo-browser-worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test worker
        working-directory: services/shimo-browser-worker
        run: npm test

      - name: Build worker image
        run: docker build -f services/shimo-browser-worker/Dockerfile -t cats-company-shimo-worker-ci services/shimo-browser-worker

  webapp:
    name: Web and SkillHub tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Restore webapp dependencies
        id: webapp-node-modules
        uses: actions/cache@v4
        with:
          path: webapp/node_modules
          key: ${{ runner.os }}-node24-webapp-${{ hashFiles('webapp/package-lock.json') }}

      - name: Install webapp dependencies
        if: steps.webapp-node-modules.outputs.cache-hit != 'true'
        working-directory: webapp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test local showcase mock, gateway annotation demo and agent-tool verifier
        run: node --test scripts/local-onboarding-mock-server.test.mjs scripts/local-gateway-annotations-demo.test.mjs scripts/verify-agent-tools.test.mjs

      - name: SkillHub phase 1 mandatory regression
        run: npm run test:skillhub-phase1

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build webapp
        working-directory: webapp
        run: npm run build

  dependency_review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  validation:
    name: Compose and deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.example config

      - name: Validate PostgreSQL test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.postgres.example config

      - name: Validate prod compose
        run: docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config

      - name: Validate opt-in persistent runtime compose
        run: |
          OC_RUNTIME_STORE=redis OC_RUNTIME_REQUIRE_DURABLE=true OC_REDIS_URL=redis://runtime-redis:6379/0 \
            docker compose --profile runtime-redis -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config --quiet

      - name: Validate opt-in authorization-only compose
        run: |
          OC_RUNTIME_STORE=memory OC_RUNTIME_REQUIRE_DURABLE=false OC_REDIS_URL= \
            OC_DEVICE_AUTH_STORE=redis OC_DEVICE_AUTH_REQUIRE_DURABLE=true \
            OC_DEVICE_AUTH_REDIS_URL=redis://runtime-redis:6379/0 \
            OC_DEVICE_AUTH_REDIS_KEY_PREFIX=catsco:prod:device-auth \
            docker compose --profile runtime-redis -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config --quiet

      # Guard the state-root trap: an overridden CTYUN_WORKER_STATE_ROOT must
      # move the container-side volume target with it, otherwise tenant-isolated
      # worker state silently escapes the persistent volume.
      - name: Validate prod compose with overridden worker state root
        run: |
          CTYUN_WORKER_STATE_ROOT=/var/lib/catsco-worker-custom \
            docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config \
            | grep -q 'target: /var/lib/catsco-worker-custom'
          CTYUN_WORKER_STATE_ROOT=/var/lib/catsco-worker-custom \
            docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config \
            | grep -q 'CTYUN_WORKER_STATE_ROOT: /var/lib/catsco-worker-custom'

      - name: Test Dreamina worker
        working-directory: services/dreamina-worker
        run: npm test

      - name: Test attachment rollback Nginx routing with synthetic origins
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python3 deploy/attachment-privacy-rollback-nginx_test.py

      - name: Validate host Nginx timeout update
        run: |
          bash -n deploy/prod/ensure-image-timeout-nginx.sh
          bash -n deploy/prod/ensure-shimo-login-nginx.sh
          bash -n deploy/prod/ensure-cloud-worker-nginx.sh
          bash -n deploy/prod/ensure-wecom-agent-nginx.sh
          python3 deploy/prod/update-nginx-shimo-login_test.py
          python3 deploy/prod/update-nginx-cloud-worker-route_test.py
          python3 deploy/prod/update-nginx-mcp-streaming_test.py
          python3 deploy/prod/update-nginx-v1-timeout_test.py

      - name: Test cloud worker provisioning and rollback
        run: >-
          node --test deploy/prod/ops/provision-worker.test.mjs
          deploy/prod/ops/reset-worker.test.mjs deploy/prod/ops/destroy-worker.test.mjs
          deploy/prod/ops/deploy-worker-version.test.mjs deploy/prod/ops/rollback-worker.test.mjs
          deploy/prod/ops/renew-worker.test.mjs
          deploy/prod/ops/status-worker.test.mjs deploy/prod/ops/worker-deployment-profile.test.mjs
          deploy/prod/ops/billing-worker.test.mjs
          deploy/prod/ops/artifact-gateway-route.test.mjs

      - name: Test worker artifact cache with Alpine BusyBox
        run: |
          bash -n deploy/prod/ops/bootstrap-worker-artifact-cache.sh
          docker run --rm -v "$PWD:/workspace:ro" alpine:3.24.1 sh -c \
            'apk add --no-cache bash >/dev/null && bash /workspace/deploy/tests/worker-artifact-cache.sh'

      - name: Validate deploy env updates
        run: |
          python3 deploy/cloud-worker-project-config_test.py
          python3 deploy/deploy-prod-workflow_test.py
          python3 deploy/deploy-test-workflow_test.py
          bash -n deploy/shared/ensure-build-cache.sh
          bash deploy/tests/ensure-build-cache.sh
          bash -n deploy/shared/cache-source-bundle.sh
          bash deploy/tests/cache-source-bundle.sh
          bash -n deploy/remote-build-source.sh
          bash deploy/tests/remote-build-source-cache.sh
          bash -n deploy/prod/remote-deploy.sh
          bash -n deploy/test/remote-deploy.sh
          python3 deploy/prod/sync-artifact-node-env_test.py
          python3 deploy/prod/sync-worker-project-env_test.py
          python3 deploy/sync-apns-env_test.py
          python3 deploy/sync-vapid-env_test.py
          python3 deploy/sync-stt-env_test.py
          python3 deploy/sync-shimo-env_test.py
          python3 deploy/sync-shimo-worker-env_test.py
          python3 deploy/stt-nginx-config_test.py
          python3 deploy/shimo-skill-connector-nginx_test.py
          python3 deploy/website-nginx-config_test.py
          python3 deploy/nginx-config_test.py
          python3 deploy/attachment-privacy-rollback_test.py
          python3 deploy/compose-rollout_test.py
          python3 deploy/runtime-storage_test.py
          python3 deploy/session-fork-config_test.py

  docker_images:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: deploy/Dockerfile.server
            tag: cats-company-server-ci
            build_args: ""
          - name: Dreamina worker
            file: deploy/Dockerfile.dreamina
            tag: cats-company-dreamina-worker-ci
            build_args: ""
          - name: web
            file: deploy/Dockerfile.nginx
            tag: cats-company-web-ci
            build_args: "--build-arg REACT_APP_API_BASE="
          - name: public website without media
            file: deploy/Dockerfile.website
            tag: cats-company-website-ci
            build_args: "--build-arg VITE_APP_BASE_URL=https://app.catsco.cn"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -f "${{ matrix.file }}" ${{ matrix.build_args }} -t "${{ matrix.tag }}" .

  # Keep the historical required check name while the expensive, independent
  # suites run in parallel above. This gate also turns skipped/cancelled
  # dependencies into a visible failure instead of a false green check.
  test-and-validate-docker:
    name: test-and-validate-docker
    if: ${{ always() }}
    needs:
      - backend
      - backend_db
      - backend_publication
      - publication_repair_source_paired
      - publication_repair_material_paired
      - node_sdk
      - bot_example
      - shimo_worker
      - webapp
      - dependency_review
      - validation
      - docker_images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check parallel job results
        env:
          BACKEND: ${{ needs.backend.result }}
          REPAIR_SOURCE_PAIRED: ${{ needs.publication_repair_source_paired.result }}
          REPAIR_MATERIAL_PAIRED: ${{ needs.publication_repair_material_paired.result }}
          NODE_SDK: ${{ needs.node_sdk.result }}
          BOT_EXAMPLE: ${{ needs.bot_example.result }}
          SHIMO_WORKER: ${{ needs.shimo_worker.result }}
          WEBAPP: ${{ needs.webapp.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          VALIDATION: ${{ needs.validation.result }}
          DOCKER_IMAGES: ${{ needs.docker_images.result }}
        run: |
          printf 'backend=%s\nnode-sdk=%s\nbot-example=%s\nshimo-worker=%s\nwebapp=%s\ndependency-review=%s\nvalidation=%s\ndocker-images=%s\n' \
            "$BACKEND" "$NODE_SDK" "$BOT_EXAMPLE" "$SHIMO_WORKER" "$WEBAPP" "$DEPENDENCY_REVIEW" "$VALIDATION" "$DOCKER_IMAGES"
          echo "publication-repair-source-paired=$REPAIR_SOURCE_PAIRED"
          echo "publication-repair-material-paired=$REPAIR_MATERIAL_PAIRED"
          if [[ "$BACKEND" != success || "$REPAIR_SOURCE_PAIRED" != success || "$REPAIR_MATERIAL_PAIRED" != success || "$NODE_SDK" != success || "$BOT_EXAMPLE" != success || "$SHIMO_WORKER" != success || "$WEBAPP" != success || \
                "$VALIDATION" != success || "$DOCKER_IMAGES" != success || \
                ("$DEPENDENCY_REVIEW" != success && "$DEPENDENCY_REVIEW" != skipped) ]]; then
            echo 'One or more CI suites did not succeed.' >&2
            exit 1
          fi
          echo 'All parallel CI suites passed.'
