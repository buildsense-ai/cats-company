name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cats-company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate-docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cats_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d cats_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
            bot-sdk/typescript/package-lock.json
            bots/xiaoba-ts/package-lock.json

      - name: Test local showcase mock
        run: node --test scripts/local-onboarding-mock-server.test.mjs

      - name: Test backend
        run: go test ./server/...

      - name: Test image race concurrency
        run: go test -race ./server -run 'TestImageRace|TestScriptedImageUpstream' -count=1

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test PostgreSQL store contract
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run TestPostgresStoreContract -count=1 -v

      - name: Install TypeScript SDK dependencies
        working-directory: bot-sdk/typescript
        run: npm ci

      - name: Test TypeScript SDK
        working-directory: bot-sdk/typescript
        run: |
          npm run build
          npm test
          npm run test:types

      - name: Build TypeScript bot example
        working-directory: bots/xiaoba-ts
        run: |
          npm ci
          npm run build

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Audit JavaScript dependencies
        run: |
          npm audit --package-lock-only --audit-level=high
          npm audit --prefix webapp --package-lock-only --audit-level=high
          npm audit --prefix bot-sdk/typescript --package-lock-only --audit-level=high
          npm audit --prefix bots/xiaoba-ts --package-lock-only --audit-level=high

      - name: Validate test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.example config

      - name: Validate PostgreSQL test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.postgres.example config

      - name: Validate prod compose
        run: docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config

      - name: Test Dreamina worker
        working-directory: services/dreamina-worker
        run: npm test

      - name: Validate host Nginx timeout update
        run: |
          bash -n deploy/prod/ensure-image-timeout-nginx.sh
          python3 deploy/prod/update-nginx-v1-timeout_test.py

      - name: Validate production env updates
        run: |
          bash -n deploy/prod/remote-deploy.sh
          python3 deploy/prod/sync-artifact-node-env_test.py

      - name: Build server image
        run: docker build -f deploy/Dockerfile.server -t cats-company-server-ci .

      - name: Build Dreamina worker image
        run: docker build -f deploy/Dockerfile.dreamina -t cats-company-dreamina-worker-ci .

      - name: Build web image
        run: docker build -f deploy/Dockerfile.nginx --build-arg REACT_APP_API_BASE= -t cats-company-web-ci .
