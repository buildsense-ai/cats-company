name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xiaoba-client-compatibility:
    name: XiaoBa client compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CatsCompany
        uses: actions/checkout@v6
      - name: Check paired XiaoBa mainline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/check-xiaoba-client-compat.py --mode main
      - name: Test compatibility gate
        run: python3 -m unittest deploy/xiaoba-client-compatibility_test.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test backend
        run: go test ./server/...

      - name: Test race-sensitive concurrency
        run: go test -race ./server -run 'TestImageRace|TestScriptedImageUpstream|TestArtifactResultSendClaimLinearizesWithPreviewInvalidation|TestArtifactWritebackGrantSharesSnapshotCurrentBoundary|TestArtifactContextConcurrentCreateInvalidatesEveryNonCurrentWriteback|TestSkillHubMarketplace|TestSkillHubPublication(Read|Workspace|Delivery|CaptureTransport|CaptureDispatcher|UploadTransport|Peer|CommitClient|CommitDispatcher|HumanCommit|CancellationTransport|CancellationDispatcher)' -count=1

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # DB 契约测试独立成 job：与 backend（编译/单测/race/漏洞扫描）并行，
  # 避免 4~5 分钟的单步把整体墙钟拖到 9 分钟。
  # publication 套件（88 个用例，全部并行化）是 DB 契约里最重的一块，
  # 单独成 job 与 backend_db 并行，避免它串在所有其他契约后面拉长关键路径。
  backend_publication:
    name: Backend publication contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cats_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d cats_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Tune PostgreSQL for throwaway CI data
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_commit = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET full_page_writes = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW fsync"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW synchronous_commit"

      - name: Test PostgreSQL SkillHub publication entries
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestPostgresSkillHubPublication' -count=1

      - name: Test PostgreSQL SkillHub publication race hotspots
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        # race 只覆盖并发/竞态相关用例，保留关键检测同时避免全量 race 的 4~5 分钟耗时。
        run: go test -race ./server/db/postgres -run '^TestPostgresSkillHubPublication.*(Concurren|Race|Fencing|Atomic|Replay|Recovery)' -count=1

  backend_db:
    name: Backend DB contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cats_test
          POSTGRES_USER: catsco
          POSTGRES_PASSWORD: catsco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catsco -d cats_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cats_test
          MYSQL_USER: catsco
          MYSQL_PASSWORD: catsco_test
          MYSQL_ROOT_PASSWORD: catsco_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucatsco -pcatsco_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 这些契约测试对每个用例都执行完整 migration（大量 DDL/COMMIT）。
      # CI 库是纯临时的，关掉 fsync/WAL 持久化可显著缩短提交延迟，
      # 不改变任何断言语义（崩溃恢复能力不在本 job 的验证范围内）。
      - name: Tune PostgreSQL for throwaway CI data
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_commit = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET full_page_writes = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW fsync"
          docker exec "$PG_CONTAINER_ID" psql -U catsco -d cats_test -tAc "SHOW synchronous_commit"

      - name: Verify restricted MySQL schema failure
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          CATS_SESSION_FORK_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
          CATS_SESSION_FORK_MYSQL_EXPECT_PERMISSION_DENIED: "1"
        run: |
          test "$(docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -Nse 'SELECT @@GLOBAL.log_bin, @@GLOBAL.log_bin_trust_function_creators')" = $'1\t0'
          go test ./server/db/mysql -run '^TestSessionForkMySQLRestrictedSchema$' -count=1 -v

      - name: Configure dedicated CI MySQL trigger prerequisite
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          # Only this disposable service is configured as administrator. All Go
          # integration tests still connect as the database-scoped catsco user.
          docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -e 'SET GLOBAL log_bin_trust_function_creators = 1'
          test "$(docker exec -e MYSQL_PWD=catsco_root_test "$MYSQL_CONTAINER_ID" mysql -uroot -Nse 'SELECT @@GLOBAL.log_bin, @@GLOBAL.log_bin_trust_function_creators')" = $'1\t1'

      - name: Test MySQL session fork contract
        env:
          CATS_SESSION_FORK_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: |
          test -n "$CATS_SESSION_FORK_MYSQL_TEST_DSN"
          go test ./server/db/mysql -run '^TestSessionForkMySQL' -count=1 -v

      - name: Test PostgreSQL session fork contract
        env:
          CATS_SESSION_FORK_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_SESSION_FORK_PG_TEST_DSN"
          go test ./server/db/postgres -run '^TestSessionForkPostgres' -count=1 -v

      - name: Test PostgreSQL store contract
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run 'TestPostgres(AdminUserSearch|StoreContract|CloudWorkerDeploymentContract|CommercialPlanManagement|CommercialPaymentContract|CommercialAdjustmentContract|CommercialGLM53MigrationPreservesManualQuotaAndRollsBack|CommercialNativeSearchFlashMigrationPreservesManualQuotaAndRollsBack|CommercialRetireV4FlashMigrationPreservesManualQuotaAndRollsBack|CommercialFreeImageModelsMigrationGrantsAndRollsBack|CommercialAutoRenewConfigAndRuns|CommercialRecordsBeyondFirstHundred|CommercialPublicModelsPreserveRenewalAndCustomQuota|CommercialImageModels|CommercialInviteRedeemerUIDs|ArtifactRuntimeEventSequenceFollowsCommitOrder|ArtifactAppMetadataPersistence)' -count=1 -v

      - name: Test conversation task run durability and delivery
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: |
          go test ./server/db/postgres ./server/db/mysql -run '^Test(PostgresConversationTaskRun|MySQLConversationTask)' -count=1 -v
          go test -race ./server -run '^TestConversationTaskStatus(Delivery|History|Postgres)' -count=1 -v

      - name: Test PostgreSQL multi-device selection contract
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestDeviceSelection' -count=1 -v

      - name: Test PostgreSQL SkillHub dispatcher recovery
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: |
          test -n "$CATS_PG_TEST_DSN"
          go test -race ./server -run '^TestSkillHubPublication(DeliveryPostgres|CaptureTransportPostgres|CaptureDispatcher|PeerCommitPostgres)' -count=1 -v

      - name: Test PostgreSQL service agent store
        env:
          CATS_PG_TEST_DSN: postgres://catsco:catsco_test@127.0.0.1:5432/cats_test?sslmode=disable
        run: go test ./server/db/postgres -run '^TestService' -count=1 -v

      - name: Test MySQL Artifact Runtime and application metadata
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run 'TestMySQL(ArtifactRuntimeEventSequenceFollowsCommitOrder|AdminUserSearch|ArtifactAppMetadataPersistence)' -count=1 -v

      - name: Test MySQL service agent store
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run '^TestMySQLService' -count=1 -v

      - name: Test MySQL multi-device selection contract
        env:
          CATS_MYSQL_TEST_DSN: catsco:catsco_test@tcp(127.0.0.1:3306)/cats_test?parseTime=true&charset=utf8mb4
        run: go test ./server/db/mysql -run '^TestDeviceSelection' -count=1 -v

  node_sdk:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot-sdk/typescript/package-lock.json

      - name: Restore TypeScript SDK dependencies
        id: sdk-node-modules
        uses: actions/cache@v4
        with:
          path: bot-sdk/typescript/node_modules
          key: ${{ runner.os }}-node24-sdk-${{ hashFiles('bot-sdk/typescript/package-lock.json') }}

      - name: Install TypeScript SDK dependencies
        if: steps.sdk-node-modules.outputs.cache-hit != 'true'
        working-directory: bot-sdk/typescript
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test TypeScript SDK
        working-directory: bot-sdk/typescript
        run: |
          npm run build
          npm test
          npm run test:types

  bot_example:
    name: TypeScript bot example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            bots/xiaoba-ts/package-lock.json
            bot-sdk/typescript/package-lock.json

      - name: Restore bot example dependencies
        id: bot-node-modules
        uses: actions/cache@v4
        with:
          path: bots/xiaoba-ts/node_modules
          key: ${{ runner.os }}-node24-bot-example-${{ hashFiles('bots/xiaoba-ts/package-lock.json', 'bot-sdk/typescript/package-lock.json') }}

      - name: Install bot example dependencies
        if: steps.bot-node-modules.outputs.cache-hit != 'true'
        working-directory: bots/xiaoba-ts
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build TypeScript bot example
        working-directory: bots/xiaoba-ts
        run: npm run build

  shimo_worker:
    name: Shimo browser worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/shimo-browser-worker/package-lock.json

      - name: Install dependencies
        working-directory: services/shimo-browser-worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test worker
        working-directory: services/shimo-browser-worker
        run: npm test

      - name: Build worker image
        run: docker build -f services/shimo-browser-worker/Dockerfile -t cats-company-shimo-worker-ci services/shimo-browser-worker

  webapp:
    name: Web and SkillHub tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Restore webapp dependencies
        id: webapp-node-modules
        uses: actions/cache@v4
        with:
          path: webapp/node_modules
          key: ${{ runner.os }}-node24-webapp-${{ hashFiles('webapp/package-lock.json') }}

      - name: Install webapp dependencies
        if: steps.webapp-node-modules.outputs.cache-hit != 'true'
        working-directory: webapp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test local showcase mock and gateway annotation demo
        run: node --test scripts/local-onboarding-mock-server.test.mjs scripts/local-gateway-annotations-demo.test.mjs

      - name: SkillHub phase 1 mandatory regression
        run: npm run test:skillhub-phase1

      - name: Test webapp
        working-directory: webapp
        run: npm test

      - name: Build webapp
        working-directory: webapp
        run: npm run build

  dependency_review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  validation:
    name: Compose and deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.example config

      - name: Validate PostgreSQL test compose
        run: docker compose -f deploy/test/docker-compose.yml --env-file deploy/test/env.test.postgres.example config

      - name: Validate prod compose
        run: docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config

      # Guard the state-root trap: an overridden CTYUN_WORKER_STATE_ROOT must
      # move the container-side volume target with it, otherwise tenant-isolated
      # worker state silently escapes the persistent volume.
      - name: Validate prod compose with overridden worker state root
        run: |
          CTYUN_WORKER_STATE_ROOT=/var/lib/catsco-worker-custom \
            docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config \
            | grep -q 'target: /var/lib/catsco-worker-custom'
          CTYUN_WORKER_STATE_ROOT=/var/lib/catsco-worker-custom \
            docker compose -f deploy/prod/docker-compose.yml --env-file deploy/prod/env.prod.example config \
            | grep -q 'CTYUN_WORKER_STATE_ROOT: /var/lib/catsco-worker-custom'

      - name: Test Dreamina worker
        working-directory: services/dreamina-worker
        run: npm test

      - name: Validate host Nginx timeout update
        run: |
          bash -n deploy/prod/ensure-image-timeout-nginx.sh
          bash -n deploy/prod/ensure-shimo-login-nginx.sh
          bash -n deploy/prod/ensure-cloud-worker-nginx.sh
          bash -n deploy/prod/ensure-wecom-agent-nginx.sh
          python3 deploy/prod/update-nginx-shimo-login_test.py
          python3 deploy/prod/update-nginx-cloud-worker-route_test.py
          python3 deploy/prod/update-nginx-v1-timeout_test.py

      - name: Test cloud worker provisioning and rollback
        run: >-
          node --test deploy/prod/ops/provision-worker.test.mjs
          deploy/prod/ops/reset-worker.test.mjs deploy/prod/ops/destroy-worker.test.mjs
          deploy/prod/ops/deploy-worker-version.test.mjs deploy/prod/ops/rollback-worker.test.mjs
          deploy/prod/ops/renew-worker.test.mjs
          deploy/prod/ops/status-worker.test.mjs deploy/prod/ops/worker-deployment-profile.test.mjs
          deploy/prod/ops/billing-worker.test.mjs
          deploy/prod/ops/artifact-gateway-route.test.mjs

      - name: Validate deploy env updates
        run: |
          python3 deploy/cloud-worker-project-config_test.py
          python3 deploy/deploy-prod-workflow_test.py
          python3 deploy/deploy-test-workflow_test.py
          bash -n deploy/shared/ensure-build-cache.sh
          bash deploy/tests/ensure-build-cache.sh
          bash -n deploy/shared/cache-source-bundle.sh
          bash deploy/tests/cache-source-bundle.sh
          bash -n deploy/remote-build-source.sh
          bash deploy/tests/remote-build-source-cache.sh
          bash -n deploy/prod/remote-deploy.sh
          bash -n deploy/test/remote-deploy.sh
          python3 deploy/prod/sync-artifact-node-env_test.py
          python3 deploy/prod/sync-worker-project-env_test.py
          python3 deploy/sync-vapid-env_test.py
          python3 deploy/sync-stt-env_test.py
          python3 deploy/sync-shimo-env_test.py
          python3 deploy/sync-shimo-worker-env_test.py
          python3 deploy/stt-nginx-config_test.py
          python3 deploy/shimo-skill-connector-nginx_test.py
          python3 deploy/website-nginx-config_test.py
          python3 deploy/nginx-config_test.py
          python3 deploy/compose-rollout_test.py
          python3 deploy/session-fork-config_test.py

  docker_images:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: deploy/Dockerfile.server
            tag: cats-company-server-ci
            build_args: ""
          - name: Dreamina worker
            file: deploy/Dockerfile.dreamina
            tag: cats-company-dreamina-worker-ci
            build_args: ""
          - name: web
            file: deploy/Dockerfile.nginx
            tag: cats-company-web-ci
            build_args: "--build-arg REACT_APP_API_BASE="
          - name: public website without media
            file: deploy/Dockerfile.website
            tag: cats-company-website-ci
            build_args: "--build-arg VITE_APP_BASE_URL=https://app.catsco.cn"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -f "${{ matrix.file }}" ${{ matrix.build_args }} -t "${{ matrix.tag }}" .

  # Keep the historical required check name while the expensive, independent
  # suites run in parallel above. This gate also turns skipped/cancelled
  # dependencies into a visible failure instead of a false green check.
  test-and-validate-docker:
    name: test-and-validate-docker
    if: ${{ always() }}
    needs:
      - backend
      - backend_db
      - backend_publication
      - node_sdk
      - bot_example
      - shimo_worker
      - webapp
      - dependency_review
      - validation
      - docker_images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check parallel job results
        env:
          BACKEND: ${{ needs.backend.result }}
          NODE_SDK: ${{ needs.node_sdk.result }}
          BOT_EXAMPLE: ${{ needs.bot_example.result }}
          SHIMO_WORKER: ${{ needs.shimo_worker.result }}
          WEBAPP: ${{ needs.webapp.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          VALIDATION: ${{ needs.validation.result }}
          DOCKER_IMAGES: ${{ needs.docker_images.result }}
        run: |
          printf 'backend=%s\nnode-sdk=%s\nbot-example=%s\nshimo-worker=%s\nwebapp=%s\ndependency-review=%s\nvalidation=%s\ndocker-images=%s\n' \
            "$BACKEND" "$NODE_SDK" "$BOT_EXAMPLE" "$SHIMO_WORKER" "$WEBAPP" "$DEPENDENCY_REVIEW" "$VALIDATION" "$DOCKER_IMAGES"
          if [[ "$BACKEND" != success || "$NODE_SDK" != success || "$BOT_EXAMPLE" != success || "$SHIMO_WORKER" != success || "$WEBAPP" != success || \
                "$VALIDATION" != success || "$DOCKER_IMAGES" != success || \
                ("$DEPENDENCY_REVIEW" != success && "$DEPENDENCY_REVIEW" != skipped) ]]; then
            echo 'One or more CI suites did not succeed.' >&2
            exit 1
          fi
          echo 'All parallel CI suites passed.'
