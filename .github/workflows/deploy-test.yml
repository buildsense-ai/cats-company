name: Deploy Docker Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_smoke:
        description: Run one paid Image2 generation and one edit through the Codex-compatible imagegen Skill
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cats-company-deploy-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    environment: test
    env:
      TEST_STACK_ROOT: /srv/catscompany-test
      DEPLOY_CACHE_ROOT: /srv/catscompany-build-cache
      CATSCO_ARTIFACT_INDEX_URL: https://logs.catsco.fun:9000/artifacts/artifacts-index.json
      CATSCO_ARTIFACT_MANAGEMENT_URL: https://logs.catsco.fun:9000/internal/artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload test stack files
        timeout-minutes: 8
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh ${SSH_OPTS} "${REMOTE}" "bash -s -- '${DEPLOY_CACHE_ROOT}'" < deploy/shared/ensure-build-cache.sh
          ssh ${SSH_OPTS} "${REMOTE}" "mkdir -p ${TEST_STACK_ROOT}/compose ${TEST_STACK_ROOT}/env ${TEST_STACK_ROOT}/data/mysql ${TEST_STACK_ROOT}/data/uploads ${TEST_STACK_ROOT}/logs ${TEST_STACK_ROOT}/releases ${DEPLOY_CACHE_ROOT}/releases ${DEPLOY_CACHE_ROOT}/source /usr/local/bin"

          tmpdir="$(mktemp -d)"
          mkdir -p "${tmpdir}/compose" "${tmpdir}/env" "${tmpdir}/skills"
          cp deploy/test/bootstrap-server.sh "${tmpdir}/compose/"
          cp deploy/remote-build-source.sh "${tmpdir}/compose/"
          cp deploy/shared/cache-source-bundle.sh "${tmpdir}/compose/"
          cp deploy/test/remote-deploy.sh "${tmpdir}/compose/"
          cp deploy/test/remote-status.sh "${tmpdir}/compose/"
          cp deploy/test/remote-imagegen-smoke-identity.sh "${tmpdir}/compose/"
          cp deploy/test/remote-imagegen-smoke-run.sh "${tmpdir}/compose/"
          cp deploy/test/remote-imagegen-smoke-relay.sh "${tmpdir}/compose/"
          cp deploy/test/imagegen-smoke-generate.json "${tmpdir}/compose/"
          cp -R skills/imagegen "${tmpdir}/skills/"
          cp deploy/sync-vapid-env.py "${tmpdir}/compose/"
          cp deploy/sync-stt-env.py "${tmpdir}/compose/"
          cp deploy/test/docker-compose.yml "${tmpdir}/compose/"
          cp deploy/test/tinode.test.conf "${tmpdir}/compose/"
          cp deploy/init-db.sh "${tmpdir}/compose/"
          cp deploy/test/env.test.example "${tmpdir}/env/"
          cp deploy/test/env.test.postgres.example "${tmpdir}/env/"
          tar -C "${tmpdir}" -czf test-stack-files.tar.gz .
          rm -rf "${tmpdir}"

          ssh ${SSH_OPTS} "${REMOTE}" "tar -xzf - -C ${TEST_STACK_ROOT}" < test-stack-files.tar.gz
          cache_script="${TEST_STACK_ROOT}/compose/cache-source-bundle.sh"
          if ssh ${SSH_OPTS} "${REMOTE}" "bash '${cache_script}' verify '${DEPLOY_CACHE_ROOT}' '${GITHUB_SHA}'"; then
            echo "Source bundle already cached for ${GITHUB_SHA}."
          else
            source_tree="$(mktemp -d)"
            trap 'rm -rf "${source_tree}"' EXIT
            git archive --format=tar HEAD | tar -xf - -C "${source_tree}"
            # Website media is persistent on the target host. Keep it out of
            # the source mirror so code-only deploys do not re-upload media.
            rm -rf "${source_tree}/website/public"
            remote_mirror="${DEPLOY_CACHE_ROOT}/source-mirror"
            ssh ${SSH_OPTS} "${REMOTE}" \
              "bash '${cache_script}' prepare '${DEPLOY_CACHE_ROOT}' '${GITHUB_SHA}'"
            rsync --archive --compress --checksum --delete \
              -e "ssh ${SSH_OPTS}" \
              "${source_tree}/" "${REMOTE}:${remote_mirror}/"
            ssh ${SSH_OPTS} "${REMOTE}" \
              "bash '${cache_script}' pack '${DEPLOY_CACHE_ROOT}' '${GITHUB_SHA}' '${remote_mirror}'"
            rm -rf "${source_tree}"
            trap - EXIT
          fi

      - name: Deploy isolated test stack
        timeout-minutes: 45
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CATSCO_ARTIFACT_MANAGEMENT_TOKEN: ${{ secrets.CATSCO_ARTIFACT_MANAGEMENT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CATSCO_PUSH_RELAY_URL: ${{ secrets.CATSCO_PUSH_RELAY_URL }}
          CATSCO_PUSH_RELAY_TOKEN: ${{ secrets.CATSCO_PUSH_RELAY_TOKEN }}
          VOLCENGINE_STT_API_KEY: ${{ secrets.VOLCENGINE_STT_API_KEY }}
        run: |
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/bootstrap-server.sh ${TEST_STACK_ROOT}"
          printf '%s\0%s\0%s\0%s\0%s\0' \
            "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT" "$CATSCO_PUSH_RELAY_URL" "$CATSCO_PUSH_RELAY_TOKEN" |
            ssh ${SSH_OPTS} "${REMOTE}" \
              "python3 ${TEST_STACK_ROOT}/compose/sync-vapid-env.py ${TEST_STACK_ROOT}/env/test.env"
          printf '%s\0' "$VOLCENGINE_STT_API_KEY" |
            ssh ${SSH_OPTS} "${REMOTE}" \
              "python3 ${TEST_STACK_ROOT}/compose/sync-stt-env.py ${TEST_STACK_ROOT}/env/test.env"
          ssh ${SSH_OPTS} "${REMOTE}" "GITHUB_SHA=${GITHUB_SHA} TEST_STACK_ROOT=${TEST_STACK_ROOT} DEPLOY_CACHE_ROOT=${DEPLOY_CACHE_ROOT} GHCR_OWNER=${{ github.repository_owner }} GHCR_USERNAME=${GHCR_USERNAME} GHCR_TOKEN=${GHCR_TOKEN} CATSCO_ARTIFACT_INDEX_URL=${CATSCO_ARTIFACT_INDEX_URL} CATSCO_ARTIFACT_MANAGEMENT_URL=${CATSCO_ARTIFACT_MANAGEMENT_URL} CATSCO_ARTIFACT_MANAGEMENT_TOKEN=${CATSCO_ARTIFACT_MANAGEMENT_TOKEN} bash -s" <<'EOF'
          set -euo pipefail

          root="${TEST_STACK_ROOT}"
          revision="${GITHUB_SHA}"
          owner="${GHCR_OWNER}"
          chmod +x "$root/compose/remote-build-source.sh" "$root/compose/remote-deploy.sh" "$root/compose/remote-status.sh" "$root/compose/remote-imagegen-smoke-identity.sh" "$root/compose/remote-imagegen-smoke-run.sh" "$root/compose/remote-imagegen-smoke-relay.sh"
          export CATSCO_SHARED_RELEASE_ROOT="${DEPLOY_CACHE_ROOT}/releases"
          export CATSCO_SHARED_SOURCE_ROOT="${DEPLOY_CACHE_ROOT}/source"
          # Build both OCI images on the target host. The source mirror is
          # synchronized incrementally above, and Docker reuses its local
          # build cache without sending large images through GHCR.
          export REMOTE_WEB_IMAGE_MODE=local
          export REMOTE_WEBSITE_IMAGE_MODE=local
          "$root/compose/remote-build-source.sh" "$root" "$revision" "$owner"
          export SKIP_IMAGE_PULL=1
          "$root/compose/remote-deploy.sh" "$root" "$revision"
          "$root/compose/remote-status.sh" "$root"
          EOF

      - name: Run real Codex-compatible imagegen smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_smoke }}
        timeout-minutes: 35
        env:
          IMAGEGEN_SMOKE_UPSTREAM_API_KEY: ${{ secrets.IMAGEGEN_SMOKE_UPSTREAM_API_KEY }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          remote_key="${TEST_STACK_ROOT}/run/imagegen-smoke-key"
          remote_run="${TEST_STACK_ROOT}/run/imagegen-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/remote-imagegen-smoke-identity.sh cleanup ${TEST_STACK_ROOT} ${remote_key}" || true
            ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/remote-imagegen-smoke-relay.sh disable ${TEST_STACK_ROOT} ${GITHUB_RUN_ID}" || true
          }
          trap cleanup EXIT

          if [[ -n "${IMAGEGEN_SMOKE_UPSTREAM_API_KEY}" ]]; then
            printf '%s\n' "${IMAGEGEN_SMOKE_UPSTREAM_API_KEY}" |
              ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/remote-imagegen-smoke-relay.sh enable ${TEST_STACK_ROOT} ${GITHUB_RUN_ID}"
          fi
          ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/remote-imagegen-smoke-identity.sh prepare ${TEST_STACK_ROOT} ${remote_key}"
          set +e
          ssh ${SSH_OPTS} "${REMOTE}" "bash ${TEST_STACK_ROOT}/compose/remote-imagegen-smoke-run.sh ${TEST_STACK_ROOT} ${remote_key} ${remote_run}"
          smoke_status=$?
          set -e
          mkdir -p imagegen-smoke
          scp ${SSH_OPTS} -r "${REMOTE}:${remote_run}/." imagegen-smoke/ || true
          exit "${smoke_status}"

      - name: Upload real imagegen smoke results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.image_smoke }}
        uses: actions/upload-artifact@v6
        with:
          name: imagegen-smoke-${{ github.sha }}
          path: imagegen-smoke/
          if-no-files-found: warn
          retention-days: 7

      - name: Dump remote status on failure
        if: failure()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          SSH_OPTS="-o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=40"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "bash ${TEST_STACK_ROOT}/compose/remote-status.sh ${TEST_STACK_ROOT} || true"
